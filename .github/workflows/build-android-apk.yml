          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Set CI debug version
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          run_number = int(os.environ['GITHUB_RUN_NUMBER'])
          run_attempt = os.environ.get('GITHUB_RUN_ATTEMPT', '1')
          version_code = 1000 + run_number
          version_name = f"0.1.0-debug.{run_number}.{run_attempt}"

          path = Path('android-app/build.gradle')
          text = path.read_text(encoding='utf-8')
          text = text.replace('versionCode 1', f'versionCode {version_code}', 1)
          text = text.replace("versionName '0.1.0'", f"versionName '{version_name}'", 1)
          path.write_text(text, encoding='utf-8')
          print(f'Using versionCode={version_code}, versionName={version_name}')
          PY

      - name: Build APK
        run: |
          gradle :android-app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vbam-android-debug-apk
          path: android-app/build/outputs/apk/debug/*.apk
